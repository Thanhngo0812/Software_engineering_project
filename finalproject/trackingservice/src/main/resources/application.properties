spring.application.name=trackingservice
# Server Port
server.port=8082


# --- DATABASE CONFIG (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_bus_tracking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- REDIS CONFIG ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:smartbus-redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- KAFKA CONFIG ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=tracking-group
spring.kafka.consumer.auto-offset-reset=earliest

core-service.url=${CORE_SERVICE_URL:http://localhost:8081}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.smartbus.tracking=DEBUG

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh